# Manifest lint suppression on pyproject.toml. Every entry was audited with
# `ruff check --select <RULE>` (not assumed) and either scoped to a
# per-file-ignore matching its actual violation sites, or deleted outright
# when it had zero hits anywhere in the project (PIE790, S105 -- both
# removed entirely, not excepted). Real hit counts, by rule:
#   TID252 (global, 15 hits / 4 files under tools/): uniform
#     `from .. import` / `from ..module import` idiom reaching the parent
#     package -- confirmed the same pattern in every file, not masking
#     inconsistent design.
#   S101 (tests/*, was 62 hits incl. 3 in src/): the 3 src/ hits were the
#     EH001 asserts, now fixed to explicit if/raise; S101 fires only in
#     tests/ after that fix.
#   PLC0415 (__init__.py, 4 hits): deferred imports in main()/_run_fetch()
#     that keep the --fetch (systemd timer) path from importing the full
#     MCP server stack.
#   PLR0913 (server.py + tools/entries.py, 2 hits): the MCP tool wrapper
#     and its implementation for the same list_entries query function,
#     which legitimately takes 8 independent optional filters.
#   PLR2004 (fetcher.py, 2 hits): HTTP 304/200 in the conditional-request
#     fetch logic.
#   PLW0603 (config.py + database.py, 2 hits): the module-global singleton
#     accessor idiom (get_config/get_db).
#   TRY003 (opml.py, 2 hits): long messages on FeedReaderError subclasses
#     raised directly in opml.py.
#   RUF022 (tools/__init__.py, 1 hit): the project's only __all__, grouped
#     by tool category with comment headers rather than alphabetically.
[[exceptions]]
check = "manifest_lint_suppression"
path = "pyproject.toml"
justification = "Every ignore entry was individually audited with `ruff check --select <RULE>` and scoped to its actual violation sites (or deleted if it had zero hits); see pyproject.toml comments and gourmand-exceptions.toml comment above for real hit counts per rule"
classification = "by_design"
