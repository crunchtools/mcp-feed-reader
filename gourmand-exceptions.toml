# SQL built by concatenating a module-level constant (_FEED_LIST_SQL) or a
# fixed list of hardcoded condition clauses with literal strings; every
# actual value is bound via a `?` placeholder in the params tuple passed to
# sqlite3. No user input ever enters the SQL text itself. Previously
# triaged as not exploitable.
[[exceptions]]
check = "unsafe_sql_construction"
path = "src/mcp_feed_reader_crunchtools/tools/feeds.py"
justification = "SQL is built by concatenating _FEED_LIST_SQL (a module constant) with fixed WHERE-clause literals; all actual values are bound via ? placeholders, not interpolated into the SQL text -- not exploitable"
classification = "by_design"

# The docstring's example dates ("2026-08-23", "2026-08-23T00:00:00Z")
# illustrate the accepted ISO-8601 format for since_days/published_after/
# published_before; they are documentation examples, not a computed or
# hardcoded timestamp used in logic.
[[exceptions]]
check = "hardcoded_years"
path = "src/mcp_feed_reader_crunchtools/server.py"
justification = "2026 appears only in docstring example dates illustrating the accepted ISO-8601 format for date-filter parameters, not a real timestamp used in logic"
classification = "by_design"

