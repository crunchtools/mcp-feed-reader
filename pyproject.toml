[project]
name = "mcp-feed-reader-crunchtools"
version = "0.2.1"
description = "Secure MCP server for RSS/Atom feed reading — SQLite-backed, self-contained"
requires-python = ">=3.10"
license = "AGPL-3.0-or-later"
authors = [
    { name = "crunchtools.com" }
]
readme = "README.md"
keywords = ["mcp", "rss", "atom", "feed-reader", "sqlite"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: GNU Affero General Public License v3 or later (AGPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "fastmcp>=2.0",
    "httpx>=0.28",
    "pydantic>=2.0",
    "feedparser>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[project.scripts]
mcp-feed-reader-crunchtools = "mcp_feed_reader_crunchtools:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_feed_reader_crunchtools"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "S", "B", "C4", "C901", "DTZ", "T10", "ISC", "PIE", "PT", "RET", "SIM", "TID", "TCH", "ARG", "PLC", "PLE", "PLR", "PLW", "TRY", "RUF"]
ignore = [
    # TID252: relative imports within the package. Audited with
    # `ruff check --select TID252` -- 15 hits across 4 files under tools/
    # (categories.py, entries.py, feeds.py, opml.py), all the same
    # `from .. import database as db` / `from ..module import X` idiom
    # reaching the parent package. Confirmed uniform, not masking
    # inconsistent design.
    "TID252",
]

[tool.ruff.lint.pylint]
max-branches = 10
max-statements = 50

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "PLC0415", "PLR2004", "ARG002"]
# TRY003: 2 hits, both in opml.py's own FeedReaderError subclass messages.
"src/mcp_feed_reader_crunchtools/tools/opml.py" = ["TRY003"]
# PLR0913: 2 hits -- the MCP tool wrapper and its implementation for the
# same query-filter function (list_entries), which legitimately takes 8
# independent optional filters.
"src/mcp_feed_reader_crunchtools/server.py" = ["PLR0913"]
"src/mcp_feed_reader_crunchtools/tools/entries.py" = ["PLR0913"]
# PLR2004: 2 hits, HTTP status codes (304/200) in the feed-fetch conditional
# request logic.
"src/mcp_feed_reader_crunchtools/fetcher.py" = ["PLR2004"]
# PLW0603: 2 hits, the module-global singleton accessor idiom
# (get_config/get_db).
"src/mcp_feed_reader_crunchtools/config.py" = ["PLW0603"]
"src/mcp_feed_reader_crunchtools/database.py" = ["PLW0603"]
# PLC0415: 4 hits, deferred imports in main()/_run_fetch() that keep the
# CLI's --fetch path from importing the full MCP server (mcp.server.fastmcp)
# when only doing a systemd-timer fetch-and-exit.
"src/mcp_feed_reader_crunchtools/__init__.py" = ["PLC0415"]
# RUF022: 1 hit, the only __all__ in the project, grouped by tool category
# (Feeds/Entries/Categories/OPML) with comment headers rather than sorted
# alphabetically.
"src/mcp_feed_reader_crunchtools/tools/__init__.py" = ["RUF022"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[[tool.mypy.overrides]]
module = "feedparser"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
