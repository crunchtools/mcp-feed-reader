# Container release: build once per change, gate the digest, promote what was
# tested (constitution III and Container Image VII). The merge does not
# rebuild: it promotes the pull request's gated digest to :main, and a v* tag
# copies main's digest to the version tags and :latest. Quay.io only.

name: Container

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  schedule:
    - cron: "10 4 * * 1"   # weekly: base-image errata, gated like any build
  workflow_dispatch:

permissions: {}

jobs:
  container:
    uses: crunchtools/constitution/.github/workflows/container-release.yml@v1.41.0
    permissions:
      contents: read
      pull-requests: read
    with:
      image: quay.io/crunchtools/mcp-feed-reader
      boot: mcp
      # The image defaults the database to /data, which the non-root gate user
      # cannot create; point it at a writable path. No request reaches it.
      boot-env: |
        FEED_READER_DB=/tmp/feeds.db
    secrets:
      QUAY_USERNAME: ${{ secrets.QUAY_USERNAME }}
      QUAY_PASSWORD: ${{ secrets.QUAY_PASSWORD }}
